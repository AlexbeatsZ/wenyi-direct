[project]
name = "kamyi"
version = "0.1.0"
description = "Kamyi: chapter-first literary translation inspired by Wenyi."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "ebooklib>=0.18",
    "httpx>=0.27",
    "lxml>=5.0",
    "openai>=1.40",
    "pydantic>=2.7",
    "pypdf>=6.14.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tenacity>=8.2",
    "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
kamyi = "wenyi_direct.cli:app"
wenyi-direct = "wenyi_direct.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wenyi_direct"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
