name: Task boundary patch

on:
  push:
    branches:
      - agent/stage-commands-and-staggered-pipeline

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-commands-and-staggered-pipeline
      - uses: astral-sh/setup-uv@v5
      - name: Install project
        run: uv sync --dev
      - name: Apply task patches
        run: |
          python scripts/apply_task_boundary_patch.py
          python scripts/apply_task_terminology_lock.py
          python scripts/apply_task_docs_patch.py
      - name: Format and lint
        run: uv run ruff check . --fix --unsafe-fixes
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize strict staggered task execution"
          git push
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
