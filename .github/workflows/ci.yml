name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --dev
      - name: Apply final legacy-test updates
        run: |
          python - <<'PY'
          from pathlib import Path

          checkpoint = Path("tests/test_checkpoints.py")
          text = checkpoint.read_text(encoding="utf-8")
          old = '"pipeline": {"repair_context_segments": 0},'
          new = (
              '"pipeline": {'
              '"repair_context_segments": 0, '
              '"max_language_rechecks": 0'
              '},'
          )
          if old in text:
              checkpoint.write_text(text.replace(old, new, 1), encoding="utf-8")

          pipeline = Path("tests/pipeline_core_cases.py")
          text = pipeline.read_text(encoding="utf-8")
          old = '''    assert len(language_repair_calls) == 1
    language_payload = _payload(language_repair_calls[0]["messages"])
    assert len(language_payload["required_output"]["translations"]) == 2
'''
          new = '''    assert len(language_repair_calls) == 2
    assert sorted(
        len(_payload(call["messages"])["required_output"]["translations"])
        for call in language_repair_calls
    ) == [1, 1]
'''
          if old in text:
              pipeline.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply Ruff fixes once
        run: uv run ruff check . --fix --unsafe-fixes
      - name: Commit automated fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update legacy tests for bounded rechecks"
          git push
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
