name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --dev
      - name: Isolate checkpoint merge test from language recheck
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_checkpoints.py")
          text = path.read_text(encoding="utf-8")
          old = '"pipeline": {"repair_context_segments": 0},'
          new = (
              '"pipeline": {'
              '"repair_context_segments": 0, '
              '"max_language_rechecks": 0'
              '},'
          )
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply Ruff fixes once
        run: uv run ruff check . --fix --unsafe-fixes
      - name: Commit automated fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply automated test and Ruff fixes"
          git push
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
