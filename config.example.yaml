language:
  source: ja
  target: zh-CN

# Provider/model definitions and default role routing are centralized in the user
# models.yaml shown in models.example.yaml. Add `roles:` here only for a deliberate
# project-specific exception.

window:
  max_read_chars: 60000
  max_write_chars: 18000
  source_halo_chars: 8000
  past_context_chars: 4000

pipeline:
  factual_audit: true
  chinese_reader_audit: true
  max_repair_attempts: 2
  repair_context_segments: 2

segment:
  max_chars_per_segment: 0

paths:
  state_dir: state
  output_dir: outputs
  terminology_file: terminology.yaml

output:
  mono: true
  bilingual: false
  about_page: true
